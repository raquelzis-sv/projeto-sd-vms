# Camada de balanceamento
[balanceadores]
vm-b1 ansible_host=192.168.56.11 ansible_ssh_private_key_file=/home/vagrant/.ssh/vm-b1.key lb_nome=B1 lb_estado=MASTER lb_prioridade=101
vm-b2 ansible_host=192.168.56.12 ansible_ssh_private_key_file=/home/vagrant/.ssh/vm-b2.key lb_nome=B2 lb_estado=BACKUP lb_prioridade=100

# Camada de aplicação
[aplicacoes]
vm-apps ansible_host=192.168.56.20 ansible_ssh_private_key_file=/home/vagrant/.ssh/vm-apps.key

# Máquina que roda o Ansible (e os testes)
[controle]
vm-controle ansible_connection=local

[all:vars]
ansible_user=vagrant
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
